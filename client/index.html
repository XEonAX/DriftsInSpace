<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drifts in Space</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05050f; }
      #game-canvas { display: block; }

      /* ── Ship Picker ───────────────────────────────────────── */
      #ship-picker {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(5, 5, 15, 0.97);
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #e0e8ff;
        z-index: 100;
      }
      .picker-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 90%; max-width: 700px; }
      .picker-inner h1 { font-size: 2rem; letter-spacing: 3px; text-transform: uppercase; color: #a0c4ff; }
      .name-row input {
        padding: 10px 16px; font-size: 1rem; border-radius: 6px;
        border: 1px solid #334; background: #0d0d22; color: #e0e8ff;
        width: 280px; outline: none;
      }
      .name-row input:focus { border-color: #5588ff; }
      .ship-grid { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
      .ship-card {
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        padding: 16px; width: 148px; border-radius: 10px;
        border: 2px solid #2a2a44; background: #0f0f20;
        cursor: pointer; transition: border-color .15s, background .15s;
      }
      .ship-card:hover { border-color: #4466bb; background: #141428; }
      .ship-card.selected { border-color: #5599ff; background: #12122a; }
      .ship-card img { width: 100px; height: 100px; object-fit: contain; }
      .ship-name { font-weight: 600; font-size: .95rem; }
      .ship-stats { display: flex; gap: 8px; font-size: .75rem; color: #8899bb; }
      #launch-btn {
        padding: 12px 48px; font-size: 1.1rem; font-weight: 600;
        border: none; border-radius: 8px; cursor: pointer;
        background: #3366ff; color: #fff; letter-spacing: 1px;
        transition: background .15s, opacity .15s;
      }
      #launch-btn:disabled { opacity: 0.35; cursor: not-allowed; }
      #launch-btn:not(:disabled):hover { background: #4477ff; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
