<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0840"/>
      <stop offset="100%" stop-color="#05050f"/>
    </radialGradient>
    <radialGradient id="hull" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e8d898"/>
      <stop offset="100%" stop-color="#a07820"/>
    </radialGradient>
    <radialGradient id="eng" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b080ff"/>
      <stop offset="100%" stop-color="#3a0a99" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Space background -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="4"  cy="6"  r="0.55" fill="white" opacity="0.75"/>
  <circle cx="27" cy="4"  r="0.45" fill="white" opacity="0.6"/>
  <circle cx="6"  cy="25" r="0.4"  fill="white" opacity="0.5"/>
  <circle cx="28" cy="24" r="0.55" fill="white" opacity="0.65"/>
  <circle cx="29" cy="13" r="0.4"  fill="white" opacity="0.5"/>
  <circle cx="3"  cy="17" r="0.35" fill="white" opacity="0.45"/>

  <!-- Engine glow -->
  <ellipse cx="16" cy="22.5" rx="4.5" ry="3.5" fill="url(#eng)"/>

  <!-- Engine exhaust trails -->
  <line x1="13.8" y1="21.5" x2="12.8" y2="27.5" stroke="#8050e8" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <line x1="16"   y1="23"   x2="16"   y2="29.5" stroke="#a070ff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <line x1="18.2" y1="21.5" x2="19.2" y2="27.5" stroke="#8050e8" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>

  <!-- Ship body (top-down teardrop) -->
  <path d="M16 4.5 C11.5 8.5 9.5 14 10 20.5 Q11 23.5 16 24.5 Q21 23.5 22 20.5 C22.5 14 20.5 8.5 16 4.5Z"
        fill="url(#hull)"/>

  <!-- Wings -->
  <path d="M10.2 18 C8 16.5 4.5 18.5 4.5 21 L10 20.5Z" fill="#c8a030"/>
  <path d="M21.8 18 C24 16.5 27.5 18.5 27.5 21 L22 20.5Z" fill="#c8a030"/>

  <!-- Wing edge detail -->
  <line x1="4.5" y1="21" x2="10" y2="20.5" stroke="#a07820" stroke-width="0.5" opacity="0.7"/>
  <line x1="27.5" y1="21" x2="22" y2="20.5" stroke="#a07820" stroke-width="0.5" opacity="0.7"/>

  <!-- Cockpit -->
  <ellipse cx="16" cy="11" rx="2.8" ry="3.8" fill="#09204a"/>
  <ellipse cx="16" cy="11" rx="1.8" ry="2.6" fill="#1848a0" opacity="0.85"/>
  <ellipse cx="15.1" cy="9.4" rx="0.7" ry="1.0" fill="#8abcff" opacity="0.45"/>

  <!-- Hull centre line -->
  <line x1="16" y1="15" x2="16" y2="22.5" stroke="#906010" stroke-width="0.5" opacity="0.5"/>
</svg>